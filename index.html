<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>花蓮哨兵 — 台9線花蓮全縣即時路況｜車速偵測、CCTV快照、管制通報</title>
  <meta name="description" content="花蓮哨兵提供花蓮全縣台9線（和平至富里）即時車速、各路口監視器影像快照、路段施工管制與即時通報。花蓮公路旅行與返鄉必備決策儀表板。" />
  <meta name="keywords" content="花蓮路況,台9線即時影像,花蓮CCTV,花蓮即時車速,崇德路況,玉里路況,吉安路況,花蓮道路救援" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="花蓮哨兵 — 台9線花蓮全縣即時路況" />
  <meta property="og:description" content="全縣即時車速、關鍵路口監視器影像、施工與管制通報一覽。" />

  <meta name="theme-color" content="#0b0f17" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>

  <style>
    body { background-color: #0b0f17; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .glass-card { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none; } }
  </style>
</head>
<body class="min-h-screen pb-16">

  <div id="root">
    <main aria-busy="true" style="max-width:540px;margin:0 auto;padding:20px;color:#fff;font-family:system-ui,sans-serif">
      <header style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h1 style="font-size:1.35rem;font-weight:700">花蓮哨兵</h1>
        <span style="border:1px solid #10b981;border-radius:999px;padding:2px 10px;color:#10b981;font-size:0.75rem">系統載入中</span>
      </header>
      <section style="padding:20px;border-radius:12px;background:#161b22;text-align:center;border:1px solid #334155">
        <span style="color:#94a3b8;font-size:0.875rem">花蓮全縣縱谷幹道資料讀取中...</span>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // ===== 花蓮縣台9線：和平 145K → 縣界橋 304.737K（約 160 公里）=====
    const TOTAL_KM = 160;

    // 南下順序（北 → 南）。km 為 VD / CCTV 里程區間
    const SEGMENTS = [
      { key: 'north', name: '崇德・新城・花蓮市', km: [145, 192], limit: 60 },
      { key: 'jian',  name: '吉安・壽豐',         km: [192, 217], limit: 60 },
      { key: 'mid',   name: '鳳林・光復',         km: [217, 246], limit: 70 },
      { key: 'south', name: '瑞穗・玉里・富里',   km: [246, 305], limit: 70 }
    ];

    // CCTV 分區：a 崇德・新城・花蓮市 / b 吉安・壽豐 / c 鳳林・光復 / d 瑞穗・玉里・富里
    const sectionOf = (km) => km < 192 ? 'a' : km < 217 ? 'b' : km < 246 ? 'c' : 'd';

    // 地標（里程為路標里程，與 TDX 里程可能差約 1K，故標題用「近○○」）
    const PLACES = [
      [145,'和平'],[149,'中仁隧道'],[158,'大清水'],[162,'崇德'],[168,'太魯閣大橋北'],
      [174,'三棧'],[183,'北埔'],[187,'新城花蓮市界'],[190,'花蓮市中山路'],[192.5,'吉安南埔'],
      [198,'木瓜溪橋'],[203.5,'志學'],[206,'壽豐'],[214,'溪口'],[217,'新豐平大橋'],
      [224,'鳳林'],[229,'長橋'],[232.4,'馬太鞍溪橋'],[235.4,'光復'],[243,'大和'],
      [246.3,'富源'],[255.3,'瑞穗'],[264.2,'舞鶴'],[266.1,'三民'],[272.4,'大禹'],
      [277.2,'玉里'],[282.85,'安通'],[287.45,'東里'],[301.2,'富里'],[304.7,'縣界橋']
    ];
    const nearPlace = (km) =>
      PLACES.reduce((best, p) => Math.abs(p[0] - km) < Math.abs(best[0] - km) ? p : best)[1];

    // "166K+230" -> 166.23
    const parseMile = (s) => {
      const m = String(s || '').match(/(\d+)\s*K\s*\+?\s*(\d*)/i);
      return m ? parseInt(m[1], 10) + (m[2] ? parseInt(m[2], 10) / 1000 : 0) : NaN;
    };

    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="100%" height="100%" fill="#111827"/>' +
      '<text x="50%" y="50%" fill="#64748b" font-size="16" font-family="sans-serif" text-anchor="middle">影像暫時無法載入</text></svg>');

    createApp({
      setup() {
        const direction = ref('south');
        const activeSection = ref('all');
        const showAllCCTV = ref(false);
        const updateTimeDisplay = ref('--:--');
        const tick = ref(Date.now());
        const vdRawData = ref([]);
        const newsRawData = ref([]);
        const cctvRawData = ref([]);

        const getJson = async (name, t) => {
          const res = await fetch(`./data/${name}.json?t=${t}`);
          return res.ok ? res.json() : null;
        };

        const loadData = async () => {
          const t = Date.now();
          try {
            const vd = await getJson('vd', t);
            if (vd) {
              vdRawData.value = vd.VDLives || [];
              if (vd.UpdateTime) {
                updateTimeDisplay.value = new Date(vd.UpdateTime)
                  .toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
              }
            }
          } catch (e) { console.error('VD 載入失敗:', e); }
          try {
            const news = await getJson('news', t);
            if (news) newsRawData.value = news.Newses || [];
          } catch (e) { console.error('新聞載入失敗:', e); }
          try {
            const cctv = await getJson('cctv', t);
            if (cctv) cctvRawData.value = cctv.CCTVs || [];
          } catch (e) { console.error('CCTV 載入失敗:', e); }
        };

        // ---- 各區間車速（分方向；沒車的偵測器不計入，不再用假數字）----
        const currentSegments = computed(() => {
          // LinkID 第 8 碼：0 = 順樁(南下)、1 = 逆樁(北上)。若發現方向相反，把 '0' 與 '1' 對調即可。
          const flag = direction.value === 'south' ? '0' : '1';
          const list = direction.value === 'south' ? SEGMENTS : [...SEGMENTS].reverse();

          return list.map(seg => {
            const [lo, hi] = seg.km;
            const speeds = [];
            vdRawData.value.forEach(vd => {
              const m = String(vd.VDID || '').match(/-0090-(\d{3})-/);
              if (!m) return;
              const km = parseInt(m[1], 10);
              if (km < lo || km >= hi) return;
              (vd.LinkFlows || []).forEach(link => {
                if (String(link.LinkID || '').charAt(7) !== flag) return;
                (link.Lanes || []).forEach(lane => {
                  if (lane.Speed > 0 && lane.Speed < 140) speeds.push(lane.Speed);
                });
              });
            });
            const hasData = speeds.length > 0;
            const mileage = direction.value === 'south'
              ? `台9線 ${lo}K-${Math.round(hi)}K`
              : `台9線 ${Math.round(hi)}K-${lo}K`;
            return {
              ...seg, mileage, hasData,
              speed: hasData ? Math.round(speeds.reduce((a, b) => a + b, 0) / speeds.length) : 0
            };
          });
        });

        const overallAvgSpeed = computed(() => {
          const ok = currentSegments.value.filter(s => s.hasData);
          return ok.length ? Math.round(ok.reduce((a, b) => a + b.speed, 0) / ok.length) : 0;
        });

        const totalEstimatedMinutes = computed(() =>
          overallAvgSpeed.value ? Math.round((TOTAL_KM / overallAvgSpeed.value) * 60) : '--');

        const decision = computed(() => {
          const spd = overallAvgSpeed.value;
          if (!spd) {
            return {
              title: '目前車流稀少',
              desc: '偵測器這一分鐘幾乎沒有車輛通過，無法估算車速，可參考下方監視器影像。'
            };
          }
          if (spd >= 52) {
            return {
              title: '花蓮縱谷全線暢通',
              desc: '台9線和平至富里車流流暢，市區外環道與各主要大橋均維持正常車速。'
            };
          }
          if (spd >= 38) {
            return {
              title: '部分路段車多放緩',
              desc: '花蓮市區外環、吉安路口或進行道路刨鋪路段車速較緩，請保持行車安全距離。'
            };
          }
          return {
            title: '主要幹道回堵壅塞',
            desc: '連假出遊或施工管制點出現車多排隊，請留意號誌指示並耐心駕駛。'
          };
        });

        const filteredNews = computed(() =>
          newsRawData.value
            .filter(n => !((n.Title || '') + (n.Description || '')).includes('國5路況專區'))
            .sort((a, b) => new Date(b.PublishTime) - new Date(a.PublishTime))
            .slice(0, 6));

        // ---- CCTV：直接顯示資料裡所有花蓮段監視器，依里程排序、同點同向去重 ----
        const cctvFiltered = computed(() => {
          const seen = new Set();
          const rows = [];
          for (const c of cctvRawData.value) {
            const km = parseMile(c.LocationMile);
            if (!c.VideoImageURL || isNaN(km)) continue;
            if (activeSection.value !== 'all' && sectionOf(km) !== activeSection.value) continue;
            const key = c.LocationMile + '|' + c.RoadDirection;
            if (seen.has(key)) continue;
            seen.add(key);
            const url = c.VideoImageURL;
            const d = c.SurveillanceDescription || '';
            rows.push({
              id: c.CCTVID,
              km,
              title: '近' + nearPlace(km) + '・' + c.LocationMile,
              desc: (c.RoadName && c.RoadName !== '台9線' ? c.RoadName + '・' : '') +
                    (/^台9線\s*\d/.test(d) || !d ? (c.RoadDirection === 'N' ? '北向鏡頭' : '南向鏡頭') : d),
              mileage: c.LocationMile,
              snapshotUrl: url + (url.includes('?') ? '&' : '?') + 't=' + tick.value
            });
          }
          rows.sort((a, b) => direction.value === 'south' ? a.km - b.km : b.km - a.km);
          return rows;
        });

        // 公開資料中沒有監視器的路段（相鄰兩支相距 10 公里以上）
        const cctvGaps = computed(() => {
          const kms = [...new Set(cctvRawData.value.map(c => parseMile(c.LocationMile)).filter(k => !isNaN(k)))]
            .sort((a, b) => a - b);
          if (!kms.length) return [];
          const pts = [145, ...kms, 304.7];
          const out = [];
          for (let i = 1; i < pts.length; i++) {
            const from = pts[i - 1], to = pts[i];
            if (to - from < 10) continue;
            if (activeSection.value !== 'all' && sectionOf(from) !== activeSection.value && sectionOf(to) !== activeSection.value) continue;
            out.push(`${Math.round(from)}K–${Math.round(to)}K（約 ${Math.round(to - from)} 公里，${nearPlace(from)} 至 ${nearPlace(to)}）`);
          }
          return out;
        });

        const PREVIEW = 8;
        const cctvList = computed(() =>
          (!showAllCCTV.value && activeSection.value === 'all')
            ? cctvFiltered.value.slice(0, PREVIEW)
            : cctvFiltered.value);
        const totalCctvCount = computed(() => cctvFiltered.value.length);
        const previewCount = PREVIEW;

        const getStatusBadge = (spd) => {
          if (spd >= 52) return 'bg-emerald-500/20 text-emerald-400';
          if (spd >= 35) return 'bg-amber-500/20 text-amber-400';
          return 'bg-rose-500/20 text-rose-400';
        };
        const getStatusText = (spd) => spd >= 52 ? '順暢' : spd >= 35 ? '車多' : '壅塞';
        const getSpeedColor = (spd) => {
          if (spd >= 52) return 'text-emerald-400';
          if (spd >= 35) return 'text-amber-400';
          return 'text-rose-400';
        };
        const barColor = (spd) => spd >= 52 ? 'bg-emerald-500' : spd >= 35 ? 'bg-amber-500' : 'bg-rose-500';

        const handleImgError = (e) => {
          e.target.onerror = null;
          e.target.src = PLACEHOLDER;
        };

        const setDirection = (d) => { direction.value = d; showAllCCTV.value = false; };

        onMounted(() => {
          loadData();
          setInterval(loadData, 30000);
          setInterval(() => { tick.value = Date.now(); }, 30000);
        });

        return {
          direction, activeSection, showAllCCTV, updateTimeDisplay,
          currentSegments, overallAvgSpeed, totalEstimatedMinutes, decision,
          filteredNews, cctvList, totalCctvCount, previewCount, cctvGaps,
          getStatusBadge, getStatusText, getSpeedColor, barColor,
          handleImgError, setDirection
        };
      },
      template: `
        <div class="max-w-4xl mx-auto px-4 pt-6">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 pulse-dot"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">花蓮哨兵 Hualien Sentinel</h1>
              </div>
              <p class="text-xs text-slate-400 mt-1">台9線花蓮全境縱谷公路・即時車速、監視器快照與路況管制</p>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <div class="text-right">
                <div class="text-[11px] text-slate-400">公路局 TDX 即時資料</div>
                <div class="text-xs font-mono text-emerald-400">{{ updateTimeDisplay }}</div>
              </div>
              <div class="bg-slate-800/90 p-1 rounded-xl flex text-xs font-medium border border-slate-700/50">
                <button
                  @click="setDirection('south')"
                  :class="direction === 'south' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  南下 往富里
                </button>
                <button
                  @click="setDirection('north')"
                  :class="direction === 'north' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">
                  北上 往崇德
                </button>
              </div>
            </div>
          </header>

          <section class="mt-6 glass-card rounded-2xl p-6 relative overflow-hidden border-indigo-500/20">
            <div class="flex flex-col md:flex-row justify-between gap-6">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 mb-2">
                  <span>● 花蓮哨兵全線決策</span>
                </div>
                <h2 class="text-2xl font-extrabold text-white">{{ decision.title }}</h2>
                <p class="text-sm text-slate-300 mt-1.5 max-w-lg leading-relaxed">{{ decision.desc }}</p>
              </div>

              <div class="flex gap-4 items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 shrink-0">
                <div>
                  <div class="text-xs text-slate-400">和平 ⇄ 縣界 總程</div>
                  <div class="text-2xl font-bold font-mono text-emerald-400">{{ totalEstimatedMinutes }} <span class="text-xs text-slate-400">分</span></div>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div>
                  <div class="text-xs text-slate-400">全線均速</div>
                  <div class="text-2xl font-bold font-mono text-white">{{ overallAvgSpeed || '--' }} <span class="text-xs text-slate-400">km/h</span></div>
                </div>
              </div>
            </div>

            <div v-if="filteredNews.length > 0" class="mt-5 pt-4 border-t border-slate-800">
              <div class="text-xs font-bold text-amber-400 mb-2">⚠️ 花蓮全縣路段管制／施工即時通報</div>
              <div class="space-y-2">
                <div v-for="news in filteredNews" :key="news.NewsID" class="text-xs bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                  <div class="text-amber-300 font-semibold mb-1">{{ news.Title }}</div>
                  <div class="text-slate-300 leading-relaxed">{{ news.Description }}</div>
                </div>
              </div>
            </div>
          </section>

          <!-- 花蓮四大分區即時車速 -->
          <section class="mt-8">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">台9線花蓮各幹道區間車速・{{ direction === 'south' ? '南下' : '北上' }}</h3>
              <span class="text-[11px] text-slate-500">單位：km/h</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
              <div v-for="seg in currentSegments" :key="seg.key" class="glass-card rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <span class="text-[11px] font-mono text-indigo-400">{{ seg.mileage }}</span>
                    <h4 class="font-bold text-sm text-white mt-0.5">{{ seg.name }}</h4>
                  </div>
                  <span v-if="!seg.hasData" class="text-[11px] px-2 py-0.5 rounded font-medium bg-slate-500/20 text-slate-400">車少</span>
                  <span v-else :class="getStatusBadge(seg.speed)" class="text-[11px] px-2 py-0.5 rounded font-medium">
                    {{ getStatusText(seg.speed) }}
                  </span>
                </div>

                <div class="flex items-baseline gap-2 mt-2">
                  <span class="text-2xl font-extrabold font-mono" :class="seg.hasData ? getSpeedColor(seg.speed) : 'text-slate-500'">
                    {{ seg.hasData ? seg.speed : '--' }}
                  </span>
                  <span class="text-xs text-slate-400">km/h (速限 {{ seg.limit }})</span>
                </div>

                <div class="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                  <div
                    class="h-full rounded-full transition-all"
                    :class="barColor(seg.speed)"
                    :style="{ width: seg.hasData ? Math.min(100, (seg.speed / seg.limit) * 100) + '%' : '0%' }">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 關鍵點位 CCTV 快照 -->
          <section class="mt-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
              <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                  全縣 CCTV 快照・{{ direction === 'south' ? '由北往南' : '由南往北' }}
                </h3>
              </div>
              <div class="flex flex-wrap gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs">
                <button @click="activeSection = 'all'" :class="activeSection === 'all' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">全縣</button>
                <button @click="activeSection = 'a'" :class="activeSection === 'a' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">崇德・花蓮市</button>
                <button @click="activeSection = 'b'" :class="activeSection === 'b' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">吉安・壽豐</button>
                <button @click="activeSection = 'c'" :class="activeSection === 'c' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">鳳林・光復</button>
                <button @click="activeSection = 'd'" :class="activeSection === 'd' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 rounded-lg transition">瑞穗・玉里・富里</button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <div v-for="cam in cctvList" :key="cam.id" class="glass-card rounded-xl overflow-hidden group">
                <div class="relative bg-slate-900 aspect-video flex items-center justify-center overflow-hidden">
                  <img
                    :src="cam.snapshotUrl"
                    :alt="cam.title"
                    loading="lazy"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    @error="handleImgError($event)"
                  />
                  <span class="absolute top-2 left-2 bg-black/70 backdrop-blur text-[10px] text-white px-1.5 py-0.5 rounded">
                    {{ cam.mileage }}
                  </span>
                </div>
                <div class="p-2.5">
                  <div class="text-xs font-semibold text-white truncate">{{ cam.title }}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5 truncate">{{ cam.desc }}</div>
                </div>
              </div>
            </div>

            <div v-if="cctvList.length === 0" class="text-center text-xs text-slate-500 py-8">
              此分區目前沒有可用的監視器資料
            </div>

            <p v-if="cctvGaps.length" class="mt-3 text-[11px] text-slate-500 leading-relaxed">
              公開資料中沒有監視器的路段：{{ cctvGaps.join('；') }}
            </p>

            <div v-if="!showAllCCTV && activeSection === 'all' && totalCctvCount > previewCount" class="mt-4 text-center">
              <button @click="showAllCCTV = true" class="px-5 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition">
                展開花蓮全縣所有 {{ totalCctvCount }} 個監視點 ▼
              </button>
            </div>
            <div v-if="showAllCCTV && activeSection === 'all' && totalCctvCount > previewCount" class="mt-4 text-center">
              <button @click="showAllCCTV = false" class="px-5 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition">
                收合監視點 ▲
              </button>
            </div>
          </section>

          <footer class="mt-12 pt-6 border-t border-slate-800 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>花蓮即時路況監測・公路局 TDX 開放資料介接</p>
            <div class="flex gap-4">
              <a href="https://168.thb.gov.tw/" target="_blank" rel="noopener" class="hover:text-slate-300 underline">公路局 168 即時路況</a>
            </div>
          </footer>
        </div>
      `
    }).mount('#root');
  </script>
</body>
</html>
