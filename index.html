  <script>

    const ROUTE_CODE = '0080';
    const ROAD_NAME = '台8線';
    const SEG_KM = 22;   // 以「太魯閣 189K – 天祥 167K」約 22 公里估算車程
    // 路段：km 範圍（依實際台8線花蓮段地理里程校正：大禹嶺約 112K、天祥約 167K、布洛灣約 177K、太魯閣約 189K）

        nameW: '太魯閣 ⇄ 燕子口（錦文橋／長春祠）', mileW: '台8線 189K-178K' },

        nameW: '布洛灣 ⇄ 天祥（綠水／九曲洞）', mileW: '台8線 177K-167K' },
      { key: 'tianxiang', from: 112, to: 166, limit: 40, nameE: '大禹嶺 ⇄ 天祥（關原／洛韶／西寶）', mileE: '台8線 112K-166K',
        nameW: '天祥 ⇄ 大禹嶺（西寶／洛韶／關原）', mileW: '台8線 166K-112K' }
    ];
    // 攝影機區段：a=太魯閣–燕子口、b=布洛灣–天祥、c=天祥以西至大禹嶺
    const camSec = (km) => km >= 178 ? 'a' : km >= 167 ? 'b' : 'c';
    const SEC_DEF = [['all', '全部'], ['a', '太魯閣–燕子口'], ['b', '布洛灣–天祥'], ['c', '天祥以西']];
    // 方向：E = 往太魯閣／花蓮市區（下山），W = 往天祥／大禹嶺（上山）
    const CAM_NAMES = {};   // 可填 { 'CCTV-xx-0080-xxx-001': '燕子口' } 自訂鏡頭名稱
    // ==============================================

    createApp({
      setup() {
        const direction = ref('east');
        const activeSection = ref('all');
        const showAllCCTV = ref(false);
        const updateTimeDisplay = ref('--:--');
        const vdUpdateMs = ref(0);
        const loadFailed = ref(false);

        const camCatalog = ref(null);
        let catalogTried = false;

        const refreshing = ref(false);
        const refreshMsg = ref('');
        const fetchTimeDisplay = ref('');

        const lastRefreshDisplay = ref('');

        const STALE_MIN = 30;
        const MIN_GAP_MS = 60 * 60000; // 與 Worker 同步為 60 分鐘獨立冷卻
        const POLL_MS = 10000;
        const POLL_MAX = 24;

        // 方向正規化：N/W 開頭 → W（往天祥／大禹嶺），S/E 開頭 → E（往太魯閣），其餘（空值/雙向/未知）→ BOTH
        const normDir = (d) => {
          const t = String(d || '').trim().toUpperCase();
          if (/^[NW]/.test(t) || t.includes('西') || t.includes('北')) return 'W';
          if (/^[SE]/.test(t) || t.includes('東') || t.includes('南')) return 'E';
          return 'BOTH';
        };
        const camDir = (c) => { const m = String(c.VideoImageURL || '').match(/\(([NSEW])\)\/snapshot/); return m ? m[1] : c.RoadDirection; };
        const camKm = (c) => { const m = String(c.LocationMile || '').match(/(\d+)\s*K\s*\+?\s*(\d*)/i); return m ? +m[1] + (m[2] ? +m[2] / 1000 : 0) : NaN; };

        const loadJson = async (name) => {
          const res = await fetch(`./data/${name}.json?t=${Date.now()}`, { cache: 'no-store' }); if (!res.ok) throw new Error(name + ' ' + res.status); return res.json(); };  const loadData = async () => { let ok = true; try { const vd = await loadJson('vd'); vdRawData.value = vd.VDLives \vert{}\vert{} []; if (vd.UpdateTime) { const d = new Date(vd.UpdateTime); vdUpdateMs.value = d.getTime(); updateTimeDisplay.value = d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); } } catch (e) { ok = false; console.error(e); } try { newsRawData.value = (await loadJson('news')).Newses \vert{}\vert{} []; } catch (e) { console.error(e); } if (!catalogTried) { catalogTried = true; try { const cams = (await loadJson('cctv-catalog')).cameras; camCatalog.value = cams && cams.length ? cams : null; } catch (e) { camCatalog.value = null; } } if (!camCatalog.value) { try { cctvRawData.value = (await loadJson('cctv')).CCTVs \vert{}\vert{} []; } catch (e) { console.error(e); } } try { const s = await loadJson('status'); fetchTimeDisplay.value = new Date(s.updated).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); } catch (e) {} loadFailed.value = !ok; if (ok) lastRefreshDisplay.value = new Date().toLocaleTimeString('zh-TW', { hour12: false }); };  const loadStatusMs = async () => { try { return Date.parse((await loadJson('status')).updated) \vert{}\vert{} 0; } catch (e) { return 0; } }; const sleep = (ms) => new Promise(r => setTimeout(r, ms)); const markDone = () => { justUpdated.value = true; setTimeout(() => { justUpdated.value = false; }, 3000); }; const reloadAll = async () => { await loadData(); tick.value = Date.now(); camTick.value = Date.now(); };  const onRefresh = async () => { if (refreshing.value) return; refreshing.value = true; justUpdated.value = false; refreshMsg.value = ''; try { const before = await loadStatusMs(); if (before && Date.now() - before < MIN_GAP_MS) { await reloadAll(); refreshMsg.value = '資料剛更新過，已載入最新版本'; markDone(); return; } let res; try { res = await (await fetch(REFRESH_API, { method: 'POST' })).json(); } catch (e) { throw new Error('Worker 連不上'); } if (res.status === 'cooldown') { await reloadAll(); refreshMsg.value = '剛有人更新過，已載入目前最新資料（約 ' + Math.max(1, Math.ceil(res.retryAfter / 60)) + ' 分鐘後可再更新）'; markDone(); return; } if (res.status !== 'started') throw new Error('Worker 回應 ' + res.status + (res.code ? ' ' + res.code : '') + (res.detail ? '：' + res.detail : '')); refreshMsg.value = '已通知更新，約需 1～3 分鐘…'; for (let i = 0; i < POLL_MAX; i++) { await sleep(POLL_MS); if ((await loadStatusMs()) > before) { await reloadAll(); refreshMsg.value = '✅ 已更新'; markDone(); return; } } refreshMsg.value = '更新時間較久，請稍後再按一次'; } catch (e) { console.error(e); refreshMsg.value = '更新失敗（' + e.message + '）'; } finally { refreshing.value = false; } };  const ageMin = computed(() => vdUpdateMs.value ? Math.floor((tick.value - vdUpdateMs.value) / 60000) : null); const isStale = computed(() => !vdUpdateMs.value \vert{}\vert{} ageMin.value > STALE_MIN); const ageText = computed(() => { const m = ageMin.value; if (m === null) return ''; if (m < 60) return m + ' 分鐘前'; if (m < 1440) return Math.floor(m / 60) + ' 小時前'; return Math.floor(m / 1440) + ' 天前'; });  // 各路段車速：只用狀態正常的偵測器；沒資料就是 null，不編數字 const currentSegments = computed(() => { const west = direction.value === 'west'; const re = new RegExp('-' + ROUTE_CODE + '-(\\d{3})-'); const list = west ? [...segBase].reverse() : segBase; return list.map(seg => { const speeds = []; vdRawData.value.forEach(vd => { const m = (vd.VDID \vert{}\vert{} '').match(re); if (!m \vert{}\vert{} vd.Status !== 0) return; const km = +m[1]; if (km < seg.from \vert{}\vert{} km > seg.to) return; (vd.LinkFlows \vert{}\vert{} []).forEach(link => (link.Lanes \vert{}\vert{} []).forEach(lane => { if (lane.Speed > 0 && lane.Speed < 140) speeds.push(lane.Speed); })); }); const speed = speeds.length ? Math.round(speeds.reduce((a, b) => a + b, 0) / speeds.length) : null; return { key: seg.key, limit: seg.limit, speed, name: west ? seg.nameW : seg.nameE, mileage: west ? seg.mileW : seg.mileE }; }); });  const overallAvgSpeed = computed(() => { const valid = currentSegments.value.filter(s => s.speed !== null); return valid.length ? Math.round(valid.reduce((a, b) => a + b.speed, 0) / valid.length) : null; }); const totalEstimatedMinutes = computed(() => overallAvgSpeed.value ? Math.round((SEG_KM / overallAvgSpeed.value) * 60) : null);  // 中橫通報：標題含台8、中橫、太魯閣、天祥、大禹嶺、合歡、燕子口、九曲洞等；新的在前 const NEWS_KEYS = /台8\vert{}中橫\vert{}太魯閣\vert{}天祥\vert{}大禹嶺\vert{}合歡\vert{}燕子口\vert{}九曲洞\vert{}慈恩\vert{}西寶\vert{}洛韶\vert{}關原/; const suhuaNews = computed(() => newsRawData.value.filter(n => NEWS_KEYS.test((n.Title \vert{}\vert{} '') + (n.Description \vert{}\vert{} '')) && !/台9丁\vert{}蘇花/.test(n.Title \vert{}\vert{} '')) .sort((a, b) => new Date(b.PublishTime \vert{}\vert{} 0) - new Date(a.PublishTime \vert{}\vert{} 0))); const filteredNews = computed(() => suhuaNews.value.slice(0, 6)); const closureNews = computed(() => suhuaNews.value.filter(n => /封閉\vert{}管制\vert{}中斷\vert{}坍方\vert{}落石/.test((n.Title \vert{}\vert{} '') + (n.Description \vert{}\vert{} ''))));  const decision = computed(() => { const spd = overallAvgSpeed.value; const closure = closureNews.value.length > 0; const rockNote = '中橫山區落石、坍方風險高，行車請留意路況。'; if (spd === null) { return { tone: closure ? 'warn' : 'none', badge: closure ? '● 有管制／落石通報' : '● 資料不足', title: closure ? '有管制或落石通報・請先確認' : '暫無可靠車速資料', desc: '中橫部分路段偵測器較少，車速可能無資料。請參考下方鏡頭與通報，並查看公路局 1968 官方路況。' }; } const note = closure ? '目前有封閉／管制／落石通報，出發前請先確認下方通報。' : rockNote; if (spd >= 40) { return { tone: closure ? 'warn' : 'ok', badge: closure ? '● 車速正常・有通報' : '● 車速正常', title: closure ? '車速正常・出發前請確認管制' : '中橫車速正常・可出發', desc: '偵測車速正常。' + note }; } else if (spd >= 25) { return { tone: 'warn', badge: '● 車流偏慢', title: '車速偏慢・留意前方狀況', desc: '部分路段車速放緩，可能有遊覽車、施工或管制。' + note }; } return { tone: 'bad', badge: '● 車速偏低', title: '車速偏低・建議確認後再上山', desc: '偵測車速偏低，可能有排隊、單線雙向或管制。' + note }; });  const toneBadge = { ok: 'bg-emerald-500/20 text-emerald-300', warn: 'bg-amber-500/20 text-amber-300', bad: 'bg-rose-500/20 text-rose-300', none: 'bg-slate-500/20 text-slate-300' };  const camPool = computed(() => { if (camCatalog.value) { return camCatalog.value.map(c => ({ id: c.id, road: c.road, dir: normDir(c.dir), mile: c.mile, km: c.km, url: c.url, desc: c.desc \vert{}\vert{} '' })); } return cctvRawData.value .filter(c => c.VideoImageURL && (c.RoadName === ROAD_NAME \vert{}\vert{} String(c.CCTVID \vert{}\vert{} '').includes(`-${ROUTE_CODE}-`)))
            .map(c => ({

              km: camKm(c),

          const dirCode = direction.value === 'east' ? 'E' : 'W';
          const dirText = direction.value === 'east' ? '往太魯閣' : '往天祥／大禹嶺';
          const list = [];
          camPool.value.forEach(c => {
            if (c.road !== ROAD_NAME) return;
            // 允許「符合目前方向」或「無方向標示/雙向 (BOTH)」的鏡頭顯示
            if (c.dir !== dirCode && c.dir !== 'BOTH') return;
            if (isNaN(c.km)) return;
            if (activeSection.value !== 'all' && camSec(c.km) !== activeSection.value) return;

              id: c.id,
              km: c.km,
              title: CAM_NAMES[c.id] || (c.desc && !/^台8/.test(c.desc) ? c.desc : c.road + ' ' + c.mile),

              snapshotUrl: c.url + (c.url.includes('?') ? '&' : '?') + 't=' + camTick.value
            });
          });

          list.sort((x, y) => direction.value === 'east' ? y.km - x.km : x.km - y.km);
          return list;
        });

        const getStatusBadge = (s) => s === null ? 'bg-slate-500/20 text-slate-300' : s >= 40 ? 'bg-emerald-500/20 text-emerald-400' : s >= 25 ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400';
        const getStatusText = (s) => s === null ? '無資料' : s >= 40 ? '順暢' : s >= 25 ? '車多' : '壅塞';
        const getSpeedColor = (s) => s === null ? 'text-slate-500' : s >= 40 ? 'text-emerald-400' : s >= 25 ? 'text-amber-400' : 'text-rose-400';
        const getBarColor = (s) => s >= 40 ? 'bg-emerald-500' : s >= 25 ? 'bg-amber-500' : 'bg-rose-500';

        const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="100%" height="100%" fill="#111827"/><text x="50%" y="50%" fill="#64748b" font-size="16" text-anchor="middle" dominant-baseline="middle">影像暫時無法載入</text></svg>');
        const handleImgError = (e) => { e.target.onerror = null; e.target.src = FALLBACK_IMG; };

        const setDirection = (d) => { direction.value = d; showAllCCTV.value = false; };

        onMounted(() => {
          loadData();
          setInterval(() => { loadData(); tick.value = Date.now(); }, 30000);
          setInterval(() => { camTick.value = Date.now(); }, 60000);
        });

        return {
          direction, activeSection, showAllCCTV, updateTimeDisplay, isStale, loadFailed, ageText,
          refreshing, refreshMsg, onRefresh, fetchTimeDisplay, justUpdated, lastRefreshDisplay,
          currentSegments, overallAvgSpeed, totalEstimatedMinutes, decision, toneBadge,
          filteredNews, closureNews, cctvList, totalCctvCount, secList: SEC_DEF,
          getStatusBadge, getStatusText, getSpeedColor, getBarColor, handleImgError, setDirection
        };
      },
      template: `
        <div class="max-w-4xl mx-auto px-4 pt-6">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full pulse-dot" :class="isStale ? 'bg-amber-500' : 'bg-emerald-500'"></span>
                <h1 class="text-2xl font-bold tracking-tight text-white">啟佳｜花蓮中橫路況通</h1>
              </div>
              <p class="text-xs text-slate-400 mt-1">台8線中橫公路（太魯閣・天祥・大禹嶺）即時路況、落石管制通報</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
              <div class="text-right">
                <div class="text-[11px] text-slate-400">公路局 TDX 資料時間</div>
                <div class="text-xs font-mono" :class="isStale ? 'text-amber-400' : 'text-emerald-400'">{{ updateTimeDisplay }}<span v-if="ageText" class="text-slate-500">（{{ ageText }}）</span></div>
                <div v-if="fetchTimeDisplay" class="text-[11px] text-slate-500">最後抓取 {{ fetchTimeDisplay }}</div>
              </div>
              <div class="bg-slate-800/90 p-1 rounded-xl flex text-xs font-medium border border-slate-700/50">
                <button @click="setDirection('east')"
                  :class="direction === 'east' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">下山 往太魯閣</button>
                <button @click="setDirection('west')"
                  :class="direction === 'west' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition-all">上山 往天祥</button>
              </div>
            </div>
          </header>

          <div class="mt-5 flex items-center justify-between gap-3">
            <h2 class="text-base font-bold text-white">🚦 即時路況</h2>
            <div class="desk-refresh">
              <span v-if="lastRefreshDisplay" class="text-xs text-slate-400">最後更新：{{ lastRefreshDisplay }}</span>
              <button class="refresh-btn" @click="onRefresh" :disabled="refreshing" :aria-label="refreshing ? '更新中' : '立即更新路況'">
                <span :class="refreshing ? 'spin' : ''" aria-hidden="true">{{ refreshing ? '⟳' : (justUpdated ? '✓' : '↻') }}</span>
                <span>{{ refreshing ? '更新中…' : (justUpdated ? '已更新' : '立即更新') }}</span>
              </button>
            </div>
          </div>
          <div v-if="refreshMsg" class="mt-2 text-xs text-slate-300" aria-live="polite">{{ refreshMsg }}</div>

          <div v-if="isStale" class="mt-4 text-xs bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-lg p-3">
            ⚠️ {{ loadFailed ? '路況資料載入失敗' : '目前顯示的路況資料已超過 30 分鐘' }}，下方數字可能不是最新，請按「立即更新」取得最新資料，並以公路局官方路況為準。
          </div>

          <section class="mt-6 glass-card rounded-2xl p-6 relative overflow-hidden border-indigo-500/20">

                </div>
