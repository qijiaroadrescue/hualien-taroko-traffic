<style>
:root{--bg:#0d131b;--card:#181f2a;--line:#273140;--tx:#f1f5f9;--mut:#8a97a8;--blue:#5aaaf0;--ok:#22a05a;--busy:#d98a05;--jam:#e04848;--ctl:#7c3aed}
:root[data-theme=light]{--bg:#f3f6fa;--card:#fff;--line:#d9e1ea;--tx:#17202b;--mut:#5f6c7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
button{font:inherit;color:inherit;cursor:pointer}
.head{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:14px;background:#fff;object-fit:contain;padding:3px}
h1{font-size:1.45rem;margin:0}
.sub{color:var(--mut);font-size:.82rem;margin-top:2px}
.sub b{color:var(--blue);font-weight:600}
.dirs{display:flex;gap:8px;margin:14px 0}
.dirs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.dirs button.on{background:var(--blue);border-color:var(--blue);color:#06101c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.stat b{display:block;font-size:1.6rem}.stat span{font-size:.85rem}
.stat.on{outline:2px solid var(--blue)}
.zones{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.zone{flex:1 0 auto;min-width:56px;padding:8px 6px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:.85rem}
.zone.on{outline:2px solid var(--tx)}
.ok{--c:var(--ok)}.busy{--c:var(--busy)}.jam{--c:var(--jam)}
.zone{background:var(--c)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.88rem}
.chip.on{background:var(--blue);border-color:var(--blue);color:#06101c;font-weight:600}
.bar input{flex:1;min-width:140px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.seg{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.seg h3{margin:0;font-size:1.08rem}
.km{color:var(--mut);font-size:.85rem;margin-top:2px}
.badge{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-size:.82rem;white-space:nowrap;font-weight:600}
.seg ul{margin:10px 0;padding-left:20px;font-size:.92rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button,.btns a{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--blue);font-size:.85rem;text-decoration:none}
.news{background:var(--card);border:1px solid var(--ctl);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.news h4{margin:0 0 4px;color:#a78bfa;font-size:.95rem}.news p{margin:0;font-size:.88rem;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:24px}
h2{font-size:1.1rem;margin:28px 0 12px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);text-decoration:none}
.links b{display:block}.links span{font-size:.8rem;color:var(--mut)}
.cta{display:block;margin-top:14px;background:var(--blue);color:#06101c;border-radius:18px;padding:16px 18px;text-decoration:none}
.cta u{font-weight:700}
.note{color:var(--mut);font-size:.78rem;margin-top:18px}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:8}
.fab a{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab .call{background:#e04848}.fab .line{background:#06c755}
.fab svg{width:20px;height:20px;fill:#fff;flex:none}
@media(max-width:480px){.fab a{padding:12px 16px;font-size:.9rem}}
.legal{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--mut);line-height:1.7}
.legal h5{margin:0 0 4px;font-size:.85rem;color:var(--tx)}
.legal p{margin:0 0 14px}
.wrap{padding-bottom:150px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.box{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.box img{width:100%;border-radius:10px;background:#111827;aspect-ratio:16/9;object-fit:cover}
.box p{font-size:.85rem;color:var(--mut);margin:6px 0 14px}
</style>
</head>

const ZONES = [
  ['秀林',145,170],['新城',170,187],['花蓮市',187,192],['吉安',192,199],['壽豐',199,217],
  ['鳳林',217,230],['光復',230,246],['瑞穗',246,264],['玉里',264,290],['富里',290,305]
];
const parseMile = s => { const m = String(s||'').match(/(\d+)\s*K\s*\+?\s*(\d*)/i); return m ? +m[1] + (m[2] ? +m[2]/1000 : 0) : NaN; };
const stOf = (spd, has) => !has || spd >= 52 ? 'ok' : spd >= 35 ? 'busy' : 'jam';
const stText = { ok:'暢通', busy:'車多', jam:'壅塞' };
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="100%" height="100%" fill="#111827"/><text x="50%" y="50%" fill="#64748b" font-size="16" text-anchor="middle">影像暫時無法載入</text></svg>');
const SITE = 'https://qijiaroadrescue.com/';
const TEL = 'tel:0937165037';
const LINE = 'https://line.me/R/ti/p/%400937_165037';

createApp({
  setup() {
    const dir = ref('south'), f = ref('all'), q = ref(''), zone = ref(null), theme = ref('dark');
    const vd = ref([]), news = ref([]), cctv = ref([]), upd = ref(''), tick = ref(Date.now()), modal = ref(null);

    const get = async n => { const r = await fetch(`./data/${n}.json?t=${Date.now()}`); return r.ok ? r.json() : null; };
    const load = async () => {
      try { const d = await get('vd'); if (d) { vd.value = d.VDLives || []; if (d.UpdateTime) { const t = new Date(d.UpdateTime); upd.value = `${t.getMonth()+1}/${t.getDate()} ` + t.toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit',hour12:false}); } } } catch(e){}
      try { const d = await get('news'); if (d) news.value = d.Newses || []; } catch(e){}
      try { const d = await get('cctv'); if (d) cctv.value = d.CCTVs || []; } catch(e){}
      tick.value = Date.now();
    };

    // 區間平均車速（依方向；LinkID 第 8 碼 0=南下、1=北上）
    const speedIn = (lo, hi) => {
      const flag = dir.value === 'south' ? '0' : '1', sp = [];
      vd.value.forEach(v => {
        const m = String(v.VDID||'').match(/-0090-(\d{3})-/); if (!m) return;
        const km = +m[1]; if (km < lo || km >= hi) return;
        (v.LinkFlows||[]).forEach(l => { if (String(l.LinkID||'').charAt(7) !== flag) return;
          (l.Lanes||[]).forEach(x => { if (x.Speed > 0 && x.Speed < 140) sp.push(x.Speed); }); });
      });
      return { has: sp.length > 0, spd: sp.length ? Math.round(sp.reduce((a,b)=>a+b,0)/sp.length) : 0 };
    };

    const newsList = computed(() => news.value
      .filter(n => !((n.Title||'') + (n.Description||'')).includes('國5路況專區'))
      .sort((a,b) => new Date(b.PublishTime) - new Date(a.PublishTime)).slice(0, 20));

    const segs = computed(() => {
      const list = SEGS.map(s => {
        const r = speedIn(s.km[0], s.km[1]), south = dir.value === 'south';
        const from = south ? s.a : s.b, to = south ? s.b : s.a;
        return { ...s, ...r, st: stOf(r.spd, r.has), from, to,
          kmText: south ? `K${s.km[0]}–K${s.km[1]}` : `K${s.km[1]}–K${s.km[0]}`,
          navUrl: 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + encodeURIComponent(south ? s.na : s.nb) + '&destination=' + encodeURIComponent(south ? s.nb : s.na) };
      });
      return dir.value === 'south' ? list : list.reverse();
    });
    const zones = computed(() => {
      const z = ZONES.map(([n,lo,hi]) => { const r = speedIn(lo,hi); return { n, lo, hi, st: stOf(r.spd, r.has) }; });
      return dir.value === 'south' ? z : z.reverse();
    });
    const counts = computed(() => ({
      ok: segs.value.filter(s => s.st==='ok').length, busy: segs.value.filter(s => s.st==='busy').length,
      jam: segs.value.filter(s => s.st==='jam').length, ctl: newsList.value.length }));

    const shown = computed(() => segs.value.filter(s => {
      if (['ok','busy','jam'].includes(f.value) && s.st !== f.value) return false;
      if (zone.value && !(s.km[0] < zone.value.hi && s.km[1] > zone.value.lo)) return false;
      const k = q.value.trim(); if (k && !(s.a + s.b + s.name + s.tips.join('')).includes(k)) return false;
      return true; }));

    const setF = v => { f.value = v; };
    const pickZone = z => { zone.value = zone.value && zone.value.n === z.n ? null : z; };
    const toggleTheme = () => { theme.value = theme.value === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme.value; };

    // 即時影像：先找路段內的監視器；若公開資料沒有，就顯示距離最近的 2 支
    const openCam = s => {
      const seen = new Set(), all = [];
      cctv.value.forEach(c => { const km = parseMile(c.LocationMile); if (!c.VideoImageURL || isNaN(km)) return;
        const key = c.LocationMile + '|' + c.RoadDirection; if (seen.has(key)) return; seen.add(key); all.push({ c, km }); });
      let hit = all.filter(x => x.km >= s.km[0] && x.km < s.km[1]), near = false;
      if (!hit.length) { const mid = (s.km[0] + s.km[1]) / 2; hit = all.sort((x,y) => Math.abs(x.km-mid) - Math.abs(y.km-mid)).slice(0, 2); near = true; }
      hit.sort((x,y) => x.km - y.km);
      modal.value = { title: `${s.from} → ${s.to} 即時影像`, near, cams: hit.map(x => { const u = x.c.VideoImageURL;
        return { id: x.c.CCTVID, label: x.c.LocationMile + (x.c.RoadDirection === 'N' ? '・北向' : '・南向'), src: u + (u.includes('?') ? '&' : '?') + 't=' + tick.value }; }) };
    };
    const imgErr = e => { e.target.onerror = null; e.target.src = PH; };

    onMounted(() => { load(); setInterval(load, 30000); });
    return { dir, f, q, zone, theme, upd, modal, segs, zones, counts, shown, newsList, stText, SITE, TEL, LINE,
      setF, pickZone, toggleTheme, openCam, imgErr };
  },

    <div class="zones">

    <div class="bar">
      <button class="chip" :class="{on:f==='all'}" @click="setF('all')">全部</button>

      <input v-model="q" placeholder="搜尋地名 / 隧道…" />

    </div>

    <template v-if="f==='ctl'">
      <h2 style="margin-top:0">⚠️ 花蓮全縣路段管制／施工即時通報</h2>
      <div v-for="n in newsList" :key="n.NewsID" class="news"><h4>{{ n.Title }}</h4><p>{{ n.Description }}</p></div>
      <div v-if="!newsList.length" class="empty">目前沒有管制或施工通報</div>
    </template>

    <template v-else>
      <div v-for="s in shown" :key="s.k" class="seg" :class="s.st">
        <div class="row">
          <div>
            <h3>{{ s.from }} → {{ s.to }}{{ s.name }}</h3>
            <div class="km">約 {{ s.kmText }}</div>
          </div>
          <span class="badge">{{ stText[s.st] }}・{{ s.has ? s.spd + ' km/h' : '車少' }}</span>
        </div>
        <ul><li v-for="t in s.tips" :key="t">{{ t }}</li></ul>
        <div class="btns">
          <button @click="openCam(s)">📹 即時影像</button>
          <a :href="s.navUrl" target="_blank" rel="noopener">🗺️ 導航</a>
        </div>
      </div>
      <div v-if="!shown.length" class="empty">沒有符合條件的路段</div>
    </template>

    <h2>官方即時資訊</h2>
