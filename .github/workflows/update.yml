name: Update Traffic Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch TDX Data
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}
        run: node fetch-tdx.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@traffic.local"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "update data" && git push)
