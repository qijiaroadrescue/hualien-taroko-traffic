name: Update Traffic Data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-traffic-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch TDX Data
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}
        run: node fetch-tdx.mjs

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "TrafficBot"
          git config user.email "bot@traffic.local"
          git add data
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update data"
            git pull --rebase origin main
            git push origin main
          fi
