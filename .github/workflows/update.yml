name: Update Traffic Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

# 避免兩次執行同時 push 造成衝突
concurrency:
  group: update-traffic-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch TDX Data
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}
        run: node fetch-tdx.mjs

      # 即使上一步失敗也要提交，這樣 data/status.json 能看到失敗原因
      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@traffic.local"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update data"
            git pull --rebase -X theirs
            git push
          fi
