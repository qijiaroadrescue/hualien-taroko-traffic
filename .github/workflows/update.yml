name: Update Traffic Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-traffic-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch TDX Data
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}
        run: node fetch-tdx.mjs

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@traffic.local"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update data and static files"
            git pull --rebase origin main || true
            git push origin main
          fi
